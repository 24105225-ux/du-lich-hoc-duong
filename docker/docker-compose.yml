version: '3.8'
services:
  app:
    build:
      context: ..   # Sửa thành chấm chấm (để lùi ra ngoài một cấp về thư mục gốc du-lich-hoc-duong)
      dockerfile: Dockerfile
    image: du-lich-hoc-duong-app
    container_name: du_lich_app
    restart: unless-stopped
    tty: true
    environment:
      - SERVICE_NAME=app
      - SERVICE_TAGS=dev
    working_dir: /var/www
    volumes:
      - ..:/var/www   # Chú ý: Sửa ./:/var/www thành ..:/var/www để đồng bộ đúng thư mục gốc vào container
    networks:
      - app-network

  webserver:
    image: nginx:alpine
    container_name: du_lich_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ..:/var/www   # Sửa ./:/var/www thành ..:/var/www
      - ./conf.d/:/etc/nginx/conf.d/   # (Nếu file conf.d nằm cùng thư mục docker thì để nguyên hoặc điều chỉnh theo vị trí thực tế)
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: du_lich_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: du_lich_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

volumes:
  dbdata:
    driver: local

networks:
  app-network:
    driver: bridge